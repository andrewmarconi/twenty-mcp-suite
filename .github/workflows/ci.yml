name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: twenty-core must emit dist/ before twenty-crm-mcp can
      # typecheck against it (its exports resolve to dist/index.d.ts).
      - run: pnpm -r build
      - run: pnpm check
      - run: pnpm -r typecheck
      - run: pnpm -r test
