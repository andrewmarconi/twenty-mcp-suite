packages:
  - "packages/*"
  - "apps/*"
# Force patched dev-toolchain transitives (dev-server CVEs pulled via VitePress/Vite).
# vite <6.4.3 and esbuild <0.28.1 are the Dependabot-flagged ranges
# (esbuild GHSA-g7r4-m6w7-qqqr: dev-server arbitrary file read on Windows).
overrides:
  vite: ">=7.3.5 <8"
  esbuild: ">=0.28.1"
allowBuilds:
  esbuild: true
minimumReleaseAge: 1440
onlyBuiltDependencies:
  - esbuild
